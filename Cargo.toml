[package]
name = "better-profanity-fast"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Fast better_profanity-compatible filter implemented in Rust"
authors = ["Eric Carmichael"]
license = "MIT"
repository = "https://github.com/ckcollab/better-profanity-fast"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py39"] }
rustc-hash = "2"
unicode-normalization = "0.1"
